<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1c2330; --muted: #5f6b7a; --line: #e3e7ed;
  --accent: #2f5bd3; --accent-text: #ffffff; --ok: #1f8a4c; --ok-bg: #e5f5ec; --warn: #9a6100; --warn-bg: #fdf1dc;
  --err: #b42318; --err-bg: #fde8e7; --code-bg: #f0f2f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --card: #1a1f27; --text: #e6e9ef; --muted: #9aa4b2; --line: #2a313c;
    --accent: #6b8cff; --accent-text: #0d1220; --ok: #5fd08f; --ok-bg: #173325; --warn: #f0b75a; --warn-bg: #3a2c12;
    --err: #ff8a80; --err-bg: #3d1a18; --code-bg: #232a35;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
header { margin-bottom: 24px; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); }
.progress { margin-top: 14px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress div { height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.progress-label { margin-top: 6px; font-size: 13px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.name { font-weight: 600; font-size: 16px; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.off { color: var(--muted); background: var(--code-bg); }
.pill.wait { color: var(--warn); background: var(--warn-bg); }
.pill.err { color: var(--err); background: var(--err-bg); }
.body { margin-top: 14px; display: grid; gap: 10px; }
.help { color: var(--muted); font-size: 13px; }
button, .button { font: inherit; font-weight: 600; font-size: 14px; border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button.primary, .button.primary { background: var(--accent); color: var(--accent-text); }
button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
button:disabled { opacity: .55; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
input, select { font: inherit; width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; }
.code { font: 600 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; background: var(--code-bg); border-radius: 8px; padding: 14px; text-align: center; }
.error { color: var(--err); font-size: 13px; }
.link { color: var(--accent); background: none; border: 0; padding: 0; font-weight: 500; font-size: 13px; cursor: pointer; justify-self: start; }
.help a { color: var(--accent); }
footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{TITLE}}</h1>
    <p>Connect your own accounts. Everything is stored encrypted and only used for your requests.</p>
    <div class="progress"><div id="bar"></div></div>
    <div class="progress-label" id="progress-label"></div>
  </header>
  <section id="cards"></section>
  <footer>Signed in from Slack. This page only shows your own connections.</footer>
</main>
<script>
(function () {
  var state = null;
  var ui = {};
  var pollTimer = null;

  function api(path, body) {
    var opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "x-kafu": "1" }, body: JSON.stringify(body) };
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (data) {
        if (r.status === 401) { document.body.innerHTML = "<main><h1>Session expired</h1><p>Ask for a new link in Slack.</p></main>"; throw new Error("expired"); }
        return data;
      });
    });
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "onclick") node.addEventListener("click", attrs[k]);
      else if (k === "oninput") node.addEventListener("input", attrs[k]);
      else if (k === "value") node.value = attrs[k];
      else if (attrs[k] === null || attrs[k] === undefined) return;
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function pill(kind, text) { return el("span", { class: "pill " + kind, text: text }); }

  function helpText(text) {
    var node = el("div", { class: "help" });
    text.split(/(https:\/\/[^\s]+)/).forEach(function (part, i) {
      if (i % 2 === 1) node.appendChild(el("a", { href: part, target: "_blank", rel: "noopener", text: part.replace(/^https:\/\//, "") }));
      else if (part) node.appendChild(document.createTextNode(part));
    });
    return node;
  }

  function refresh() {
    return api("/api/status").then(function (s) { state = s; render(); schedulePoll(); });
  }

  function schedulePoll() {
    clearTimeout(pollTimer);
    var waiting = state.services.some(function (s) { return s.device && s.device.status === "pending"; });
    if (waiting) pollTimer = setTimeout(refresh, 2500);
  }

  function setUi(id, patch) { ui[id] = Object.assign({}, ui[id] || {}, patch); render(); }

  function claudeCard() {
    var c = state.claude;
    var u = ui.claude || {};
    var body = [];
    if (!c.connected) {
      if (!u.url && !c.signInUrl) {
        body.push(el("div", { class: "help", text: "Use your own Claude Pro, Max, Team or Enterprise account." }));
        body.push(el("div", { class: "actions" }, [el("button", { class: "primary", text: u.busy ? "Starting…" : "Sign in with Claude", onclick: startClaude })]));
      } else {
        var url = u.url || c.signInUrl;
        body.push(el("div", { class: "help", text: "1. Open the sign-in page and approve. 2. Paste the code Claude shows you." }));
        body.push(el("div", { class: "actions" }, [el("a", { class: "button primary", href: url, target: "_blank", rel: "noopener", text: "Open Claude sign-in" })]));
        var input = el("input", { id: "claude-code", placeholder: "Paste the code here", autocomplete: "off", value: u.draft || "", oninput: function (e) { (ui.claude = ui.claude || {}).draft = e.target.value; } });
        body.push(el("div", { class: "inline" }, [input, el("button", { class: "primary", text: u.busy ? "Checking…" : "Connect", onclick: function () { finishClaude(input.value); } })]));
        body.push(el("button", { class: "link", text: "Get a new sign-in link", onclick: function () { startClaude(true); } }));
      }
    } else {
      var select = el("select", {});
      select.appendChild(el("option", { value: "", text: "Default (" + state.defaultModel + ")" }));
      state.models.forEach(function (m) {
        var opt = el("option", { value: m.id, text: m.label + " — " + m.description.toLowerCase() });
        if (m.id === c.model) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener("change", function () { api("/api/model", { model: select.value }).then(refresh); });
      body.push(el("label", { class: "help", text: "Model" }));
      body.push(select);
      body.push(el("div", { class: "actions" }, [el("button", { class: "ghost", text: "Disconnect", onclick: function () { if (confirm("Disconnect your Claude account?")) api("/api/claude/logout", {}).then(refresh); } })]));
    }
    if (u.error) body.push(el("div", { class: "error", text: u.error }));
    return el("div", { class: "card" }, [
      el("div", { class: "row" }, [
        el("div", {}, [el("div", { class: "name", text: "Claude" }), el("div", { class: "sub", text: c.connected ? "Model: " + c.modelLabel : "Required for everything else" })]),
        c.connected ? pill("ok", "Connected") : pill(c.signInUrl || u.url ? "wait" : "off", c.signInUrl || u.url ? "Waiting for code" : "Not connected"),
      ]),
      el("div", { class: "body" }, body),
    ]);
  }

  function serviceCard(s) {
    var u = ui[s.id] || {};
    var body = [];
    var status;
    if (s.connected) {
      status = pill("ok", "Connected");
      body.push(el("div", { class: "actions" }, [el("button", { class: "ghost", text: "Disconnect", onclick: function () { if (confirm("Disconnect " + s.label + "?")) api("/api/services/" + s.id + "/disconnect", {}).then(refresh); } })]));
    } else if (s.device && s.device.status === "pending") {
      status = pill("wait", "Waiting for approval");
      body.push(el("div", { class: "help", text: "Open GitHub, enter this code and approve. This page updates by itself." }));
      body.push(el("div", { class: "code", text: s.device.code }));
      body.push(el("div", { class: "actions" }, [
        el("a", { class: "button primary", href: s.device.url, target: "_blank", rel: "noopener", text: "Open GitHub" }),
        el("button", { class: "ghost", text: "Copy code", onclick: function () { navigator.clipboard && navigator.clipboard.writeText(s.device.code); } }),
      ]));
    } else {
      status = s.device && s.device.status === "error" ? pill("err", "Sign-in failed") : pill("off", "Not connected");
      if (s.method === "github" && !u.paste) {
        body.push(el("div", { class: "actions" }, [el("button", { class: "primary", text: u.busy ? "Starting…" : "Sign in with " + s.label, onclick: function () { startDevice(s); } })]));
        body.push(el("button", { class: "link", text: "Paste a token instead", onclick: function () { setUi(s.id, { paste: true }); } }));
      } else {
        if (s.help) body.push(helpText(s.help));
        var input = el("input", { type: "password", placeholder: s.label + " token", autocomplete: "off", value: u.draft || "", oninput: function (e) { (ui[s.id] = ui[s.id] || {}).draft = e.target.value; } });
        body.push(el("div", { class: "inline" }, [input, el("button", { class: "primary", text: u.busy ? "Saving…" : "Save", onclick: function () { saveSecret(s, input.value); } })]));
      }
      if (s.device && s.device.error) body.push(el("div", { class: "error", text: s.device.error }));
    }
    if (u.error) body.push(el("div", { class: "error", text: u.error }));
    return el("div", { class: "card" }, [
      el("div", { class: "row" }, [el("div", {}, [el("div", { class: "name", text: s.label })]), status]),
      el("div", { class: "body" }, body),
    ]);
  }

  function render() {
    if (!state) return;
    var cards = document.getElementById("cards");
    cards.innerHTML = "";
    cards.appendChild(claudeCard());
    state.services.forEach(function (s) { cards.appendChild(serviceCard(s)); });
    var total = state.services.length + 1;
    var done = (state.claude.connected ? 1 : 0) + state.services.filter(function (s) { return s.connected; }).length;
    document.getElementById("bar").style.width = Math.round((done / total) * 100) + "%";
    document.getElementById("progress-label").textContent = done + " of " + total + " connected";
  }

  function startClaude(fresh) {
    setUi("claude", { busy: true, error: "" });
    api("/api/claude/start", { fresh: fresh === true }).then(function (r) {
      setUi("claude", { busy: false, url: r.url });
      if (r.url) window.open(r.url, "_blank", "noopener");
    }).catch(function (e) { setUi("claude", { busy: false, error: e.message }); });
  }

  function finishClaude(code) {
    if (!code.trim()) return;
    setUi("claude", { busy: true, error: "" });
    api("/api/claude/finish", { code: code }).then(function (r) {
      ui.claude = r.ok ? {} : { error: r.error || "That code didn't work. Get a new link and try again." };
      return refresh();
    });
  }

  function startDevice(s) {
    setUi(s.id, { busy: true, error: "" });
    api("/api/services/" + s.id + "/device", {}).then(function (r) {
      ui[s.id] = r.ok ? {} : { error: r.error };
      if (r.ok && r.device && r.device.url) window.open(r.device.url, "_blank", "noopener");
      return refresh();
    });
  }

  function saveSecret(s, value) {
    if (!value.trim()) return;
    setUi(s.id, { busy: true, error: "" });
    api("/api/services/" + s.id + "/secret", { value: value }).then(function (r) {
      ui[s.id] = r.ok ? {} : { paste: ui[s.id] && ui[s.id].paste, error: r.error };
      return refresh();
    });
  }

  refresh();
})();
</script>
</body>
</html>
